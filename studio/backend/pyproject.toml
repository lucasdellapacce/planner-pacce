[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pacce-planner-studio"
version = "0.1.0"
description = "PACCE Planner Studio - Criador de planners digitais personalizáveis"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PACCE Planner Studio"},
]

dependencies = [
    "reportlab>=4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "Pillow>=10.0",
    "cairosvg>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
